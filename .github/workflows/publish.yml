name: publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  id-token: write # required: lets npm exchange a GitHub OIDC token for a short-lived publish token
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun test
      # No NODE_AUTH_TOKEN on purpose — npm CLI detects the OIDC environment and
      # authenticates through the trusted publisher configured on npmjs.com.
      - run: npm publish --access public
