name: publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  id-token: write # required: lets npm exchange a GitHub OIDC token for a short-lived publish token
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # No registry-url on purpose: it would write _authToken=${NODE_AUTH_TOKEN}
      # into .npmrc, and there is no token — the OIDC exchange is the credential.
      # package.json publishConfig.registry already points at registry.npmjs.org.
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          package-manager-cache: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun test
      - name: npm version
        run: npm --version
      # No NODE_AUTH_TOKEN on purpose — npm CLI detects the OIDC environment and
      # authenticates through the trusted publisher configured on npmjs.com.
      - run: npm publish --access public --registry https://registry.npmjs.org
